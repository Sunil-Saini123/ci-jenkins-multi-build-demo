plugins {
    id 'java'
}

group = 'com.vit.demo'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Don't run Gradle's automatic JUnit test task.
// Our demo test is a standalone Java program.
tasks.named('test') {
    enabled = false
}

tasks.register('demoTest', JavaExec) {
    dependsOn compileTestJava
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vit.demo.AppTest'
}

tasks.named('build') {
    dependsOn demoTest
}